  " fill="#0d1117" stroke="#0d1117" stroke-width="3" stroke-linejoin="round"/>
  <!-- Left hair tuft spikes -->
  <path d="M 94 135 L 86 132 L 95 146" class="ink-line" stroke-width="2.5" />
  <path d="M 88 165 L 80 168 L 90 178" class="ink-line" stroke-width="2.5" />

  <!-- Right hair mass -->
  <path d="
    M 216 95
    C 234 100, 248 118, 246 140
    C 254 152, 254 178, 246 196
    C 242 208, 232 214, 226 212
    L 224 172
    C 226 145, 222 118, 214 95
    Z
  " fill="#0d1117" stroke="#0d1117" stroke-width="3" stroke-linejoin="round"/>
  <!-- Right hair tuft spikes -->
  <path d="M 246 135 L 254 132 L 245 146" class="ink-line" stroke-width="2.5" />
  <path d="M 252 165 L 260 168 L 250 178" class="ink-line" stroke-width="2.5" />

