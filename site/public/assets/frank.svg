  <polygon points="234,148 252,126 258,131 240,153" fill="#e53935" stroke="#0d1117" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="252,126 258,118 258,131" fill="#0d1117" stroke="#0d1117" stroke-width="1.5"/>

  <!-- Left Ear -->
  <path d="M 112 164 C 98 164, 96 192, 110 202 C 113 204, 115 200, 115 192" fill="#ffffff" stroke="#0d1117" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M 108 178 C 103 181, 105 190, 110 189" fill="none" stroke="#0d1117" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Right Ear -->
  <path d="M 228 164 C 242 164, 244 192, 230 202 C 227 204, 225 200, 225 192" fill="#ffffff" stroke="#0d1117" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M 232 178 C 237 181, 235 190, 230 189" fill="none" stroke="#0d1117" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Comb-over / thinning hair strands across top of skull -->
  <path d="M 128 92 C 142 76, 164 72, 184 76" class="ink-line" stroke-width="2.5" />
  <path d="M 138 82 C 158 68, 186 68, 204 80" class="ink-line" stroke-width="2" />
  <path d="M 166 68 C 180 64, 196 66, 212 74" class="ink-line" stroke-width="2.5" />

  <!-- ==================== FACIAL DETAILS ==================== -->
  <!-- Forehead stress creases (veteran of 500 postmortems) -->
  <path d="M 136 110 C 156 106, 184 106, 204 110" class="ink-line" stroke-width="2.5" />
  <path d="M 132 120 C 156 115, 184 115, 208 120" class="ink-line" stroke-width="3" />
  <path d="M 140 130 C 158 127, 182 127, 200 130" class="ink-line" stroke-width="2" />

  <!-- Deep vertical brow furrows (skeptical "11s") -->
  <line x1="165" y1="138" x2="164" y2="152" class="ink-line" stroke-width="2.5" />
  <line x1="170" y1="136" x2="170" y2="153" class="ink-line" stroke-width="2.2" />
  <line x1="175" y1="138" x2="176" y2="152" class="ink-line" stroke-width="2.5" />

  <!-- Bushy, blunt eyebrows angled downward -->
  <!-- Left eyebrow -->
  <polygon points="126,155 142,145 165,147 163,154 144,155 128,159" fill="#0d1117" stroke="#0d1117" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Right eyebrow -->
  <polygon points="214,155 198,145 175,147 177,154 196,155 212,159" fill="#0d1117" stroke="#0d1117" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Tired, Deadpan Eyes peering over reading glasses -->
  <!-- Left eye -->
  <path d="M 130 166 C 139 160, 151 160, 158 166" class="ink-line" stroke-width="3.5" />
  <ellipse cx="144" cy="168" rx="4.5" ry="5" fill="#0d1117" />
  <circle cx="142.5" cy="166.5" r="1.5" fill="#ffffff" />
  <path d="M 134 173 C 139 176, 149 176, 154 172" class="ink-line" stroke-width="2" />

  <!-- Right eye -->
  <path d="M 182 166 C 189 160, 201 160, 210 166" class="ink-line" stroke-width="3.5" />
  <ellipse cx="196" cy="168" rx="4.5" ry="5" fill="#0d1117" />
  <circle cx="194.5" cy="166.5" r="1.5" fill="#ffffff" />
  <path d="M 186 173 C 191 176, 201 176, 206 172" class="ink-line" stroke-width="2" />

  <!-- Eye bags / dark circles -->
  <path d="M 128 178 C 136 185, 152 185, 160 179" class="ink-line" stroke-width="2" />
  <path d="M 180 179 C 188 185, 204 185, 212 178" class="ink-line" stroke-width="2" />
  <path d="M 132 183 C 138 189, 148 189, 156 184" class="ink-line" stroke-width="1.5" />
  <path d="M 184 184 C 192 189, 202 189, 208 183" class="ink-line" stroke-width="1.5" />

  <!-- Crow's feet wrinkles -->
  <line x1="120" y1="164" x2="127" y2="167" class="ink-line" stroke-width="2" />
  <line x1="118" y1="171" x2="126" y2="171" class="ink-line" stroke-width="2" />
  <line x1="220" y1="164" x2="213" y2="167" class="ink-line" stroke-width="2" />
  <line x1="222" y1="171" x2="214" y2="171" class="ink-line" stroke-width="2" />

  <!-- ==================== READING GLASSES ==================== -->
  <!-- Left rim -->
  <rect x="122" y="170" width="42" height="21" rx="3.5" fill="#ffffff" fill-opacity="0.3" stroke="#0d1117" stroke-width="3.5"/>
  <line x1="126" y1="174" x2="132" y2="186" stroke="#0d1117" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Right rim -->
  <rect x="176" y="170" width="42" height="21" rx="3.5" fill="#ffffff" fill-opacity="0.3" stroke="#0d1117" stroke-width="3.5"/>
  <line x1="180" y1="174" x2="186" y2="186" stroke="#0d1117" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Nose bridge -->
  <path d="M 164 177 C 168 174, 172 174, 176 177" class="ink-line" stroke-width="3.5" />
  <line x1="122" y1="175" x2="111" y2="172" class="ink-line" stroke-width="2.5" />
  <line x1="218" y1="175" x2="229" y2="172" class="ink-line" stroke-width="2.5" />

  <!-- ==================== NOSE ==================== -->
  <path d="M 169 168 L 167 202 C 165 210, 160 213, 160 216 C 160 219, 169 221, 171 221 C 174 221, 180 219, 180 216 C 180 213, 175 210, 173 202" class="ink-line" stroke-width="3" />
  <path d="M 157 215 C 154 217, 158 219, 162 219" class="ink-line" stroke-width="2.5" />
  <path d="M 183 215 C 186 217, 182 219, 178 219" class="ink-line" stroke-width="2.5" />

  <!-- ==================== MUSTACHE & MOUTH ==================== -->
  <!-- Dense, authoritative chevron mustache -->
  <path d="
    M 170 221
    C 162 220, 147 223, 136 230
    C 131 235, 134 244, 142 244
    C 152 244, 161 236, 170 238
    C 179 236, 188 244, 198 244
    C 206 244, 209 235, 204 230
    C 193 223, 178 220, 170 221
    Z
  " fill="#0d1117" stroke="#0d1117" stroke-width="2" stroke-linejoin="round" />

  <!-- Salt & pepper bristle highlights -->
  <line x1="145" y1="233" x2="143" y2="241" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="154" y1="230" x2="153" y2="239" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="163" y1="228" x2="164" y2="236" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="177" y1="228" x2="176" y2="236" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="186" y1="230" x2="187" y2="239" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="195" y1="233" x2="197" y2="241" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Cynical, flat mouth line under mustache -->
  <path d="M 148 250 L 154 248 L 186 248 L 192 250" class="ink-line" stroke-width="3.5" />
  <path d="M 162 256 C 166 258, 174 258, 178 256" class="ink-line" stroke-width="2.5" />
  <path d="M 165 264 C 168 266, 172 266, 175 264" class="ink-line" stroke-width="2" />

  <!-- Stubble Dots -->
  <g fill="#0d1117">
    <circle cx="125" cy="226" r="1.2" />
    <circle cx="130" cy="233" r="1.2" />
    <circle cx="124" cy="238" r="1.2" />
    <circle cx="132" cy="244" r="1.2" />
    <circle cx="138" cy="252" r="1.2" />
    <circle cx="146" cy="260" r="1.2" />
    <circle cx="156" cy="266" r="1.2" />
    <circle cx="184" cy="266" r="1.2" />
    <circle cx="194" cy="260" r="1.2" />
    <circle cx="202" cy="252" r="1.2" />
    <circle cx="208" cy="244" r="1.2" />
    <circle cx="216" cy="238" r="1.2" />
    <circle cx="210" cy="233" r="1.2" />
    <circle cx="215" cy="226" r="1.2" />
  </g>

  <!-- ==================== LAYER 4: THE RECEIPT ("He shows the receipt") ==================== -->
  <g id="receipt-module">
    <!-- Receipt Shadow/Backing for depth -->
    <path d="
      M 256 188
      L 344 188
      L 344 380
      L 334 374 L 324 382 L 314 374 L 304 382 L 294 374 L 284 382 L 274 374 L 264 382 L 256 376
      Z
    " fill="#0d1117" />

    <!-- Receipt Paper Body with jagged serrated tears -->
    <path d="
      M 250 184
      L 257 178 L 264 184 L 271 178 L 278 184 L 285 178 L 292 184 L 299 178 L 306 184 L 313 178 L 320 184 L 327 178 L 334 184 L 340 184
      L 340 374
      L 332 368 L 322 375 L 312 368 L 302 375 L 292 368 L 282 375 L 272 368 L 262 375 L 254 368 L 250 372
      Z
    " class="receipt-paper" />

    <!-- Receipt Header Badge -->
    <rect x="257" y="193" width="76" height="16" fill="#0d1117" rx="2"/>
    <text x="295" y="205" fill="#ffffff" class="mono-heavy" font-size="9.5" text-anchor="middle" letter-spacing="1.5">RECEIPT</text>

    <!-- Dashed separator -->
    <line x1="257" y1="215" x2="333" y2="215" stroke="#0d1117" stroke-width="1.8" stroke-dasharray="3,2" />

    <!-- Core Verdict -->
    <text x="257" y="226" class="mono-regular" font-size="7.5">VERDICT FIRST:</text>
    <text x="257" y="240" class="mono-heavy" font-size="11.5">NO. LINE 41.</text>

    <line x1="257" y1="247" x2="333" y2="247" stroke="#0d1117" stroke-width="1.2" stroke-dasharray="2,2" />

    <text x="257" y="258" class="mono-regular" font-size="7.5">ran:</text>
    <text x="257" y="270" class="mono-heavy" font-size="9">git diff -U0</text>
    
    <text x="257" y="283" class="mono-regular" font-size="7.5">result:</text>
    <text x="257" y="295" class="mono-heavy" font-size="9">0 caves / 60</text>

    <line x1="257" y1="302" x2="333" y2="302" stroke="#0d1117" stroke-width="1.2" stroke-dasharray="2,2" />

    <text x="257" y="313" class="mono-regular" font-size="7">openers caught:</text>
    <text x="257" y="324" class="mono-heavy" font-size="8.5">32 &quot;you&#39;re right&quot;</text>

    <!-- Barcode -->
    <g fill="#0d1117">
      <rect x="260" y="331" width="2" height="17" />
      <rect x="264" y="331" width="1" height="17" />
      <rect x="267" y="331" width="3" height="17" />
      <rect x="272" y="331" width="1.5" height="17" />
      <rect x="275" y="331" width="1" height="17" />
      <rect x="278" y="331" width="2.5" height="17" />
      <rect x="282" y="331" width="1.5" height="17" />
      <rect x="285" y="331" width="3.5" height="17" />
      <rect x="290" y="331" width="1" height="17" />
      <rect x="293" y="331" width="2" height="17" />
      <rect x="297" y="331" width="1" height="17" />
      <rect x="300" y="331" width="3" height="17" />
      <rect x="305" y="331" width="1.5" height="17" />
      <rect x="308" y="331" width="2.5" height="17" />
      <rect x="313" y="331" width="1" height="17" />
      <rect x="316" y="331" width="2" height="17" />
      <rect x="320" y="331" width="1.5" height="17" />
      <rect x="324" y="331" width="3" height="17" />
      <rect x="329" y="331" width="1" height="17" />
    </g>

    <text x="295" y="356" class="mono-heavy" font-size="7.5" text-anchor="middle" letter-spacing="0.5">EXIT CODE 0</text>
    <text x="295" y="364" class="mono-regular" font-size="6.5" text-anchor="middle">VERIFIED IN SESSION</text>

    <!-- Frank's hand holding the receipt tape firmly -->
    <!-- Thumb clamping over receipt with knuckle detail -->
    <path d="M 238 252 C 244 238, 264 239, 268 250 C 270 256, 262 264, 248 266 Z" fill="#ffffff" stroke="#0d1117" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 254 247 C 259 249, 260 255, 258 259" class="ink-line" stroke-width="2"/>
    <!-- Index / middle finger knuckles supporting from behind -->
    <path d="M 236 266 C 242 268, 246 277, 242 284" class="ink-line" stroke-width="3"/>
    <path d="M 232 282 C 238 285, 240 294, 236 300" class="ink-line" stroke-width="3"/>
  </g>

</svg>