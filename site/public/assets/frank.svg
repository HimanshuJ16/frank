  <!-- Solid white face & weathered jaw -->
  <path d="
    M 122 102
    C 130 68, 210 68, 218 102
    C 226 122, 230 155, 228 190
    C 226 215, 222 236, 214 250
    C 204 266, 192 272, 170 272
    C 148 272, 136 266, 126 250
    C 118 236, 114 215, 112 190
