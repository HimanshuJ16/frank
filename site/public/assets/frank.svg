<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 400" width="100%" height="100%" role="img" aria-label="Frank - He answers first. He shows the receipt. He does not tell you you're right.">
  <defs>
    <style>
      .sticker-cut {
        fill: #ffffff;
        stroke: #ffffff;
        stroke-width: 22;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .ink-line {
        stroke: #0d1117;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .receipt-paper {
        fill: #ffffff;
        stroke: #0d1117;
        stroke-width: 3.5;
        stroke-linejoin: round;
      }
      .mono-heavy {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
        font-weight: 900;
        fill: #0d1117;
      }
      .mono-regular {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
        font-weight: 700;
        fill: #555555;
      }
    </style>
  </defs>

  <!-- ==================== LAYER 0: DIE-CUT STICKER BACKING ==================== -->
  <g>
    <path class="sticker-cut" d="
      M 130 90
      C 110 82, 86 108, 88 140
      C 80 156, 80 186, 88 206
      C 94 220, 104 228, 108 226
      L 102 260
      C 98 285, 70 310, 70 340
      L 70 375
      C 70 382, 195 385, 230 375
      L 236 370
      L 242 376
      L 340 376
      L 345 365
      L 348 180
      L 260 180
      C 260 160, 268 145, 260 130
      C 264 110, 244 82, 225 88
      C 205 60, 150 60, 130 90
      Z
    " />
  </g>

  <!-- ==================== LAYER 1: BASE CLOTHING & SHOULDERS ==================== -->
  <!-- Dark sweater / polo -->
  <path d="
    M 72 374
    L 72 342
    C 72 315, 105 296, 136 292
    L 204 292
    C 225 294, 238 306, 244 322
    L 240 374
    Z
  " fill="#0d1117" stroke="#0d1117" stroke-width="4" stroke-linejoin="round"/>

  <!-- White shirt collar peaking out -->
  <polygon points="132,292 160,332 172,302" fill="#ffffff" stroke="#0d1117" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="208,292 180,332 168,302" fill="#ffffff" stroke="#0d1117" stroke-width="3" stroke-linejoin="round"/>
  <line x1="170" y1="332" x2="170" y2="374" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <!-- ==================== LAYER 2: HAIR (SOLID BLACK MASSES) ==================== -->
  <!-- Left hair mass (receding temple, dense sideburns) -->
  <path d="
    M 124 95
    C 106 100, 92 118, 94 140
    C 86 152, 86 178, 94 196
    C 98 208, 108 214, 114 212
    L 116 172
    C 114 145, 118 118, 126 95
