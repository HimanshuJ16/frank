description = "Review a transcript or PR description for flattery, unverified claims, invented specifics and caves"
prompt = "Review {{args}} (or your own last five messages if empty) for exactly four things: agreement openers, claims of done/fixed/passes with no command behind them, invented specifics (hashes, line numbers, URLs, versions, test counts) checked against the repo where possible, and reversals that followed pushback rather than evidence. One line per finding: [opener|unverified|invented|cave] the quoted text, then the rewrite. End with N findings, and a receipt for what you checked."
